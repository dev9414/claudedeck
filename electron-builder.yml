appId: io.claudedeck.app
productName: ClaudeDeck
directories:
  output: release
  buildResources: assets
files:
  - out/**/*
  - package.json
extraMetadata:
  main: out/main/index.js
win:
  target:
    - target: nsis
      arch: [x64, arm64]
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.developer-tools
linux:
  target:
    - AppImage
    - deb
  category: Development
  maintainer: ClaudeDeck contributors
publish:
  provider: github
